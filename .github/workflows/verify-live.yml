name: Verify live app (manual)

# Checks the live QA portal WITHOUT deploying anything, with the same checks every deploy runs when
# it finishes (scripts/ci/post-deploy-checks.sh). The runner may be shown the host's anti-bot page
# instead of the app; the checks then ask again from the server over SSH, set up here exactly as
# deploy-prod-cpanel.yml sets it up. The QA portal has one environment. Manual only.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which deployment to check
        type: choice
        options:
          - production
        default: production
      strict:
        description: Go-live sign-off — also fail every check that could not run (a secret or test identity missing)
        type: boolean
        default: false
      revocation_drill:
        description: Revocation drill — you revoke the drill account's role in Console while the job waits (watch the log)
        type: boolean
        default: false

permissions:
  contents: read

env:
  PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
  PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
  PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
  SSH_OPTS: -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o LogLevel=ERROR -o RequestTTY=no

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_PRIVATE_KEY_B64: ${{ secrets.PROD_SSH_PRIVATE_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -n "$SSH_PRIVATE_KEY_B64" ]; then
            echo "$SSH_PRIVATE_KEY_B64" | tr -d '[:space:]' | base64 --decode | tr -d '\r' > ~/.ssh/deploy_key
          else
            printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          fi

          chmod 600 ~/.ssh/deploy_key

          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>/tmp/ssh-keygen.err; then
            echo "::error::PROD_SSH_PRIVATE_KEY is invalid or passphrase-protected."
            cat /tmp/ssh-keygen.err
            exit 1
          fi

          ssh-keyscan -p "${PROD_SSH_PORT}" "${PROD_SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Verify the live app
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          export VERIFY_SSH="ssh -i ${HOME}/.ssh/deploy_key -p ${PROD_SSH_PORT} ${SSH_OPTS} -o ConnectTimeout=20 ${PROD_SSH_USER}@${PROD_SSH_HOST}"
          bash scripts/ci/post-deploy-checks.sh "$ENVIRONMENT"

      # Console staff roles, live (scripts/ci/live-feature-checks.py; flow-react-app
      # docs/GO_LIVE_VERIFICATION.md): health reports console role sync configured, the no-role
      # account is refused, the staff account signs in with its Console roles and a refresh
      # re-checks them; on request, the revocation drill. Signs the verification accounts in only.
      - name: Live feature checks
        if: success() || failure()
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          LIVE_VERIFY_STRICT: ${{ inputs.strict && '1' || '0' }}
          LIVE_VERIFY_REVOCATION_DRILL: ${{ inputs.revocation_drill && '1' || '0' }}
          # Shared verification identities (org-level secrets; docs/GO_LIVE_VERIFICATION.md in flow-react-app).
          VERIFY_CONSOLE_API: ${{ vars.VERIFY_CONSOLE_API }}
          VERIFY_STAFF_EXPECTED_ROLES: ${{ vars.VERIFY_STAFF_EXPECTED_ROLES }}
          VERIFY_IMAP_HOST: ${{ secrets.VERIFY_IMAP_HOST }}
          VERIFY_IMAP_PORT: ${{ secrets.VERIFY_IMAP_PORT }}
          VERIFY_IMAP_USER: ${{ secrets.VERIFY_IMAP_USER }}
          VERIFY_IMAP_PASSWORD: ${{ secrets.VERIFY_IMAP_PASSWORD }}
          VERIFY_STAFF_EMAIL: ${{ secrets.VERIFY_STAFF_EMAIL }}
          VERIFY_STAFF_PASSWORD: ${{ secrets.VERIFY_STAFF_PASSWORD }}
          VERIFY_NOROLE_EMAIL: ${{ secrets.VERIFY_NOROLE_EMAIL }}
          VERIFY_NOROLE_PASSWORD: ${{ secrets.VERIFY_NOROLE_PASSWORD }}
          VERIFY_DRILL_EMAIL: ${{ secrets.VERIFY_DRILL_EMAIL }}
          VERIFY_DRILL_PASSWORD: ${{ secrets.VERIFY_DRILL_PASSWORD }}
        run: |
          export VERIFY_SSH="ssh -i ${HOME}/.ssh/deploy_key -p ${PROD_SSH_PORT} ${SSH_OPTS} -o ConnectTimeout=20 ${PROD_SSH_USER}@${PROD_SSH_HOST}"
          python3 scripts/ci/live-feature-checks.py "$ENVIRONMENT"
